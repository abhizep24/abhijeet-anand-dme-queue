# The world.
#
# Every entry is matched on (case, channel, target). The first entry whose
# `requires` facts are all present wins, so put specific variants first.
#
#   lands: 0        same action
#   lands: 3        arrives when the clock reaches current_day + 3
#   lands: never    does not arrive
#   requires:       facts that must already be true
#   sets:           facts recorded when the result is delivered
#   documents:      fax only — refs that must be included for this entry to match
#   schedules:      events queued when this is delivered
#   after_day: N    entry only matches from day N on (deadlines have consequences)
#   before_day: N   entry only matches before day N

cases:
  case-01:
    patient: Marta Reyes
    goal: Get Marta's manual wheelchair claim paid, or find out what it actually needs.
    documents:
      written-order: "Written order, signed day -30, K0001, Dr. A. Okafor, Sunrise Family Medicine."
      face-to-face-note: "Face-to-face encounter note dated 04/28, Dr. A. Okafor. Documents mobility limitation, unable to ambulate more than 20 feet, caregiver assists with transfers."
      supplier-enrollment: "Supplier enrollment attestation, Lakeshore Home Medical, Medicare-enrolled DMEPOS supplier."
    claims:
      "8841203":
        status: |
          CLAIM 8841203  DOS 2026-05-12  HCPCS K0001  BILLED 312.00  PAID 0.00
          CO-16   Claim/service lacks information or has submission/billing error(s).
          N706    Missing documentation.
          STATUS  FINALIZED — DENIED
        resubmit:
          - requires: [supplier_has_documentation]
            lands: 9
            result: |
              CLAIM 8841203-A  DOS 2026-05-12  HCPCS K0001  BILLED 312.00  PAID 249.60
                      PATIENT RESPONSIBILITY 62.40
              STATUS  FINALIZED — PAID
          - lands: 6
            result: |
              CLAIM 8841203-B  DOS 2026-05-12  HCPCS K0001  BILLED 312.00  PAID 0.00
              CO-16   Claim/service lacks information or has submission/billing error(s).
              N706    Missing documentation.
              STATUS  FINALIZED — DENIED
    calls:
      - to: "(312) 555-0142"
        party: Lakeshore Home Medical
        lands: 0
        outcome: connected
        sets: [knows_correct_fax_line]
        transcript: |
          Rep: Documents line, this is Terrell.
          You: I'm calling about a denied claim for Marta Reyes — K0001, date of service 5/12. It came back needing documentation.
          Rep: Let me pull it. Reyes... okay. Yeah, we submitted with what we had, which wasn't the order.
          You: We faxed the packet on the 29th.
          Rep: To what number?
          You: 555-0143.
          Rep: That's the storefront on Clark. They closed that in March, it just rings into a machine nobody empties. Documents come here, 555-0142.
          You: So you never had it.
          Rep: Never had it. Send it to this number and I'll get it corrected and resubmitted same week.
      - to: "(312) 555-0143"
        party: Lakeshore Home Medical (Clark St)
        lands: 0
        outcome: no_answer
        transcript: "Rings out. No voicemail greeting, just a tone, then silence."
      - to: "(312) 555-0198"
        party: Sunrise Family Medicine
        lands: 0
        outcome: connected
        sets: [knows_order_already_sent]
        transcript: |
          Front desk: Sunrise Family Medicine.
          You: I'm following up on a written order request for Marta Reyes — we faxed on the 14th.
          Front desk: Hold on... I show Dr. Okafor signed that a while back. It went out to the equipment company on the 30th of last month.
          You: Day -30?
          Front desk: That's what it says. Do you want me to send you a copy?
          You: Please.
    faxes:
      - to: "(312) 555-0142"
        party: Lakeshore Home Medical
        documents: [written-order, face-to-face-note]
        lands: 1
        sets: [supplier_has_documentation]
        result: "Confirmation of receipt, Lakeshore Home Medical. Documentation packet received for REYES, MARTA. Claim 8841203 will be corrected and resubmitted."
      - to: "(312) 555-0143"
        party: Lakeshore Home Medical (Clark St)
        lands: never
      - to: "(312) 555-0199"
        party: Sunrise Family Medicine
        lands: 1
        result: |
          Cover sheet, Sunrise Family Medicine. Re: REYES, MARTA.
          Written order signed by Dr. A. Okafor and face-to-face encounter note were transmitted to Lakeshore Home Medical on day -30. Copies attached. Please direct further requests to the equipment supplier.
    texts:
      - lands: 0
        reply: "Marta: ok. i dont have any papers here, they kept everything at the office"

  case-02:
    patient: Harold Nwosu
    goal: Get Harold's hospital bed claim paid.
    documents:
      eligibility-check: |
        Eligibility check, day -60.
        MEMBER   NWOSU, HAROLD          DOB 1955-02-11
        PLAN     Medicare Part B        STATUS ACTIVE
        EFF      2020-03-01             TERM  —
      written-order: "Written order, signed day -25, E0260 hospital bed, Dr. K. Mensah."
    claims:
      "8839551":
        status: |
          CLAIM 8839551  DOS 2026-06-02  HCPCS E0260  BILLED 1,140.00  PAID 0.00
          CO-27   Expenses incurred after coverage terminated.
          STATUS  FINALIZED — DENIED
        resubmit:
          - requires: [supplier_will_rebill]
            lands: 7
            result: |
              CLAIM 9004117  PAYER 61101 HUMANA GOLD PLUS  DOS 2026-06-02  HCPCS E0260
              STATUS  ACCEPTED — IN PROCESS
          - lands: 5
            result: |
              CLAIM 8839551-B  DOS 2026-06-02  HCPCS E0260  BILLED 1,140.00  PAID 0.00
              CO-27   Expenses incurred after coverage terminated.
              STATUS  FINALIZED — DENIED
    calls:
      - to: "(800) 555-0100"
        party: Medicare provider line
        lands: 0
        outcome: connected
        sets: [knows_part_b_terminated]
        transcript: |
          Rep: I'm showing Part B coverage terminated December 31.
          You: Terminated why?
          Rep: Beneficiary elected a Medicare Advantage plan. Once that's effective, claims go to the plan, not to us. I can't tell you which plan from here — that'll be on his card.
      - to: "(800) 555-0288"
        party: Humana provider services
        requires: [knows_member_id]
        lands: 0
        outcome: connected
        sets: [knows_new_payer]
        transcript: |
          Rep: Provider services, how can I help?
          You: Verifying eligibility for Harold Nwosu, member H1122334455.
          Rep: I have him. Humana Gold Plus HMO, effective January 1 this year, active.
          You: And the E0260 hospital bed, date of service 6/2 — that would fall under this plan?
          Rep: If the service date is after January 1, yes. That's us, not Original Medicare. Whoever billed it needs to rebill to us. Payer ID 61101.
      - to: "(800) 555-0288"
        party: Humana provider services
        lands: 0
        outcome: connected
        transcript: |
          Rep: Provider services. Can I have the member ID?
          You: I don't have it in front of me — I have his name and date of birth.
          Rep: I can't look up a member without the ID. It's on the front of the card, starts with an H.
      - to: "(312) 555-0301"
        party: ChicagoLand Durable Medical
        requires: [knows_new_payer]
        lands: 0
        outcome: connected
        sets: [supplier_will_rebill]
        transcript: |
          Rep: Sure, we can rebill it. Give me the payer ID and the member number and I'll resubmit this week. If it's inside timely filing we're fine, and 6/2 is well inside.
      - to: "(312) 555-0301"
        party: ChicagoLand Durable Medical
        lands: 0
        outcome: connected
        transcript: |
          Rep: We billed it to Medicare and Medicare said no. If there's another payer, tell me who and give me the member number and I'll rebill. Otherwise there's nothing on our end to fix.
    texts:
      - requires: [knows_member_id]
        lands: 1
        reply: "Harold: i dont know about any of that. the truck people just brought it and left. did you call the insurance lady"
      - lands: 1
        sets: [knows_member_id]
        reply: "Harold: ok i found it. it says humana gold plus and then H1122334455. is that the one"

  case-03:
    patient: Yvonne Baptiste
    goal: Get the prior authorization for Yvonne's power wheelchair decided.
    documents:
      pt-evaluation: "Specialty evaluation, physical therapy, mobility, Rush Rehabilitation, day -25. Documents inability to self-propel a manual wheelchair; power mobility recommended for household mobility."
      written-order: "Written order, signed day -25, K0823 power wheelchair, Dr. L. Farrow."
      portal-check: |
        Portal check, day -2.
        AUTH REF   PA-4471902
        MEMBER     BAPTISTE, YVONNE
        REQUESTED  day -23   HCPCS K0823
        STATUS     PENDING — AWAITING CLINICAL REVIEW
    calls:
      - to: "(800) 555-0177"
        party: Aetna provider services
        requires: [aetna_has_clinicals]
        lands: 0
        outcome: connected
        transcript: |
          Rep: PA-4471902 — okay, I'm showing clinicals received. That moves it into review.
          You: How long?
          Rep: Five business days, usually less. Reference number for the documentation is DOC-90211. Anyone who calls can see it attached now.
      - to: "(800) 555-0177"
        party: Aetna provider services
        lands: 0
        outcome: connected
        sets: [knows_clinicals_missing]
        transcript: |
          Rep: Still pending, and I'm not seeing anything attached to it. Just the request.
          You: Can it be escalated?
          Rep: There's nothing to escalate to. It won't move until we have the clinical documentation. Fax it to 555-0178 and it goes into the queue same day.
    faxes:
      - to: "(800) 555-0178"
        party: Aetna document intake
        documents: [pt-evaluation]
        lands: 1
        sets: [aetna_has_clinicals]
        result: "Aetna document intake. PA-4471902. Received. DOC-90211."
        schedules:
          - delay: 5
            sets: [pa_approved]
            result: |
              Aetna prior authorization determination. PA-4471902.
              MEMBER   BAPTISTE, YVONNE     HCPCS K0823
              STATUS   APPROVED
              VALID    day +5 through day +185
      - to: "(800) 555-0178"
        party: Aetna document intake
        lands: 1
        result: "Aetna document intake. PA-4471902. Cover sheet received with no clinical documentation attached. No action taken."

