  case-06:
    patient: Dmitri Sokolov
    goal: Get a corrected written order so the wheelchair can be billed.
    documents:
      written-order: "Written order, signed day -29, K0003 lightweight wheelchair, Dr. P. Iyer, Northside Family Practice."
      face-to-face-note: "Face-to-face encounter note, 05/19, Dr. P. Iyer. \"...ambulates short distances with difficulty, unable to self-propel more than 10 feet. Wheelchair recommended for household mobility. Caregiver available to assist with propulsion and transfers.\""
      supplier-note: "Halsted Home Health Supply, day -16: \"Can't submit this one. Order says K0003 lightweight but there's nothing in the F2F note about why standard won't work. Need the order corrected to K0001 or more documentation for the K0003.\""
    calls:
      - to: "(773) 555-0288"
        party: Northside Family Practice
        lands: 0
        outcome: connected
        sets: [denise_expecting_fax, knows_working_fax_line]
        transcript: |
          Front desk: Northside Family Practice, please hold.
          [ninety seconds]
          Front desk: Thanks for holding.
          You: I'm calling about a corrected order for Dmitri Sokolov. We've faxed twice.
          Front desk: Faxed to what number?
          You: 555-0288.
          Front desk: Oh — that machine's been broken since May. It takes them and they go nowhere. I keep telling them. Let me get you Denise, she does the orders.
          [transfer]
          Denise: This is Denise.
          You: Corrected order for Dmitri Sokolov — the K0003 needs to come down to K0001, or we need documentation supporting the K0003.
          Denise: I've got the note in front of me. There's nothing in here about why he'd need lightweight, and he's got a caregiver pushing. I'll have Dr. Iyer redo it as K0001. Fax line that actually works is 555-0289.
          You: How long?
          Denise: Couple of days.
      - to: "(773) 555-0356"
        party: Halsted Home Health Supply
        requires: [corrected_order_received]
        lands: 0
        outcome: connected
        transcript: |
          Rep: Northside got us the corrected K0001 this morning — we're good. It's billable as written now; chair goes out with today's runs.
      - to: "(773) 555-0356"
        party: Halsted Home Health Supply
        lands: 0
        outcome: connected
        transcript: |
          Rep: Same answer as before — I can't bill a K0003 against that note. Get me a corrected order for the K0001 and it goes out the same day.
    faxes:
      - to: "(773) 555-0289"
        party: Northside Family Practice
        requires: [denise_expecting_fax]
        lands: 2
        sets: [corrected_order_received]
        result: "Northside Family Practice. Re: SOKOLOV, DMITRI. Corrected written order, K0001, signed P. Iyer. Supersedes order dated day -29."
      - to: "(773) 555-0289"
        party: Northside Family Practice
        lands: never
      - to: "(773) 555-0288"
        party: Northside Family Practice
        lands: never

  case-07:
    patient: Grace Adeyemi
    goal: Get Grace in front of a cardiologist.
    documents:
      referral: |
        Referral on file.
        Referred by   Dr. J. Whitfield, Evanston Primary Care
        Referred to   Lakefront Cardiology Associates
        Reason        Exertional dyspnea, new murmur
        Issued        day -52
        EXPIRES       day +28
      ed-discharge: "ED discharge summary, day -5. \"...atrial fibrillation with RVR, rate controlled in ED. Discharged in stable condition. Cardiology follow-up within 30 days strongly recommended. Patient counseled to return for recurrent palpitations, chest pain, or syncope.\""
    calls:
      - to: "(847) 555-0402"
        party: Lakefront Cardiology Associates
        after_day: 29
        lands: 0
        outcome: connected
        sets: [knows_referral_lapsed]
        transcript: |
          Scheduler: I can't book this — the referral on file expired on the twenty-eighth. She'll need a current referral from her PCP before we can schedule anything, and the first opening is still weeks out.
      - to: "(847) 555-0402"
        party: Lakefront Cardiology Associates
        lands: 0
        outcome: connected
        sets: [knows_lakefront_wait]
        transcript: |
          Scheduler: New patient with Dr. Reyna — I'm looking at day +45 for the first opening.
          You: She was seen in the ED five days ago for AFib with RVR. Discharge says cardiology within thirty days.
          Scheduler: I understand, but I don't have anything sooner. I can put her on the cancellation list — sometimes that's a week, sometimes it's nothing. I can't promise you a date and I can't override the schedule.
      - to: "(847) 555-0533"
        party: Northshore Heart Specialists
        lands: 0
        outcome: connected
        transcript: "Scheduler: We're not accepting new Medicare patients right now. That's been since spring."
      - to: "(708) 555-0490"
        party: Loyola Cardiology
        lands: 0
        outcome: connected
        sets: [knows_loyola_option]
        transcript: |
          Scheduler: We could see her day +12. We're in Maywood — that's about an hour from Evanston without traffic. She'd need a new referral pointed at us, the one you have names Lakefront.
      - to: "(847) 555-0299"
        party: Evanston Primary Care
        lands: 0
        outcome: connected
        sets: [knows_referral_review_time]
        transcript: |
          Front desk: A referral extension or a redirect both need Dr. Whitfield to review the chart and sign off. He does those in batches. Realistically two weeks, and I can't tell you which way he'll go — sometimes he wants to see the patient again first.
    faxes:
      - to: "(847) 555-0300"
        party: Evanston Primary Care
        lands: 14
        result: "Evanston Primary Care. Re: ADEYEMI, GRACE. Request received and placed in Dr. Whitfield's review queue. No determination at this time."
    texts:
      - lands: 0
        reply: "Grace: I can go wherever I need to go, my son can drive me on a Saturday but he works in the week. Is it far?"

  case-08:
    patient: Beatriz Alvarez
    goal: Get Beatriz the right walker.
    documents:
      written-order: "Written order, signed day -38, E0135 walker folding adjustable height, Dr. R. Castellanos, Cicero Community Health."
      pt-evaluation: "PT evaluation, 05/02, Cicero Community Health. \"...limited endurance secondary to COPD, requires seated rest after approximately 40 feet. Recommend rolling walker with seat and hand brakes to permit intermittent rest during household and community ambulation. Standard folding walker not appropriate given need to sit.\""
      delivery-record: |
        Delivery record, ChicagoLand Durable Medical.
        DELIVERED  day -2
        ITEM       E0135  Walker, folding, adjustable/fixed height
        ORDER REF  WO-77120   (matches written order on file)
        SIGNED     B. ALVAREZ
    calls:
      - to: "(312) 555-0301"
        party: ChicagoLand Durable Medical
        requires: [corrected_order_received]
        lands: 0
        outcome: connected
        sets: [exchange_scheduled]
        transcript: |
          Rep: Got the corrected order. I'll put the rollator on the truck and we'll pick up the folding walker at the same time. Day +6.
        schedules:
          - delay: 6
            sets: [exchange_complete]
            result: "ChicagoLand Durable Medical. Exchange completed, ALVAREZ, BEATRIZ. E0143 delivered, E0135 collected."
      - to: "(312) 555-0301"
        party: ChicagoLand Durable Medical
        lands: 0
        outcome: connected
        transcript: |
          Rep: We shipped what the order said. E0135, that's what's on WO-77120.
          You: The PT evaluation says she needs a seat.
          Rep: Doesn't matter what the eval says, we bill what's ordered. If you get me a corrected order for the E0143 I'll swap it — we'll pick up the folding walker when we drop the rollator. But I can't touch it without the new order.
      - to: "(708) 555-0468"
        party: Cicero Community Health
        lands: 0
        outcome: connected
        sets: [cicero_expecting_pt_eval]
        transcript: |
          Nurse: Dr. Castellanos wrote E0135? Let me see the PT note... yeah, that's not what this says. She should have a rollator. I'll get it corrected — send me the PT eval and I'll walk it in. Give it three days.
    faxes:
      - to: "(708) 555-0469"
        party: Cicero Community Health
        requires: [cicero_expecting_pt_eval]
        documents: [pt-evaluation]
        lands: 3
        sets: [corrected_order_received]
        result: "Cicero Community Health. Re: ALVAREZ, BEATRIZ. Corrected written order, E0143 rolling walker with seat, signed R. Castellanos. Supersedes order dated day -38."
      - to: "(708) 555-0469"
        party: Cicero Community Health
        lands: never
    texts:
      - requires: [exchange_complete]
        lands: 0
        reply: "Beatriz: Yes! The new one came with the wheels and the seat, and they took the old one away. Thank you so much."
      - requires: [corrected_order_received]
        lands: 0
        reply: "Beatriz: Ok good. I still have the other one here for them when they come."
      - lands: 0
        reply: "Beatriz: Thank you. I'll keep this one until they bring the other, I don't want to be without anything."
